name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Siapkan proyek (otomatis unzip jika yang diunggah file ZIP)
      run: |
        if [ -f "33Shalatku-Android-Project-v2.zip" ]; then
          echo "Membuka file ZIP..."
          unzip "33Shalatku-Android-Project-v2.zip" -d project_src
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build APK debug
      run: |
        if [ -d "project_src" ]; then
          cd project_src
        fi
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sholatku-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
